# Jobbsøk_26 P0.9 run settings (control plane).
#
# These values are snapshotted into the manifest at freeze and become
# immutable for that run (DEC-40). Tuning applies to a new or child run
# only; it never edits a frozen run in place.
#
# Nothing here may branch the product. There is no language, portal,
# channel, output-mode or letter_required switch, and there never will be
# (DEC-01, DEC-02, DEC-04, Contract 22).

[spec]
revision = "0.9.0"
schema_revision = "0.9.0"
status = "FROZEN_NORMATIVE"

[product]
# Stated once, here. A per-job language field would be a core language
# branch (DEC-04). Non-Bokmål vacancies are EXCEPTION in the manifest.
language = "nb-NO"

[personality]
# DEC-35: personality is ON in the baseline and is not a dormant stub.
# There is no OFF switch; the valid null outcome is Stage 1 selecting zero
# facets, which the strategy schema already permits. Adding a toggle with
# no consumer would be an optionality-only hook (Contract 21).
profile = "context/PERSONALITY_PROFILE.md"
facet_index = "policy/personality_facets.json"
max_selected_facets = 3

[stages]
# Frozen capability roles, not volatile commercial model names (DEC-31).
# GATE-10 records which current model/surface satisfies each role for a
# given run; that mapping goes in [stages.role_mapping] below and is
# expected to change without a specification amendment.
stage1 = "SOL_CLASS"    # Decision Architecture  - strongest reasoning
stage2 = "TERRA_CLASS"  # Native Package Writer  - strongest cost-effective native writing
stage3 = "SOL_CLASS"    # Elastic Final Writer   - strongest reasoning/final writing

[stages.role_mapping]
# Populated from GATE-10 evidence. Empty until verified against the actual
# account and surface; the runtime must not guess a product name.
# Safe posture: Stage 2 MAY use SOL_CLASS if no distinct suitable
# TERRA_CLASS exists (GATE-10).
SOL_CLASS = "Codex / GPT-5.6 Sol"
TERRA_CLASS = "Codex / GPT-5.6 Terra"

[recovery]
# Spec 15.1 / Contract 9.1: one visible same-session mechanical correction
# attempt is the initial default. Tunable; not architecture.
mechanical_correction_attempts = 1

# DEC-36 / GATE-11: each entry is the earliest standard stage to restart
# for that attempt, proceeding through Stage 3. This is operator
# scaffolding only. It must never call a model, advance automatically, or
# become a retry engine. Set to [] to disable configured semantic retry.
retry_start_stages = [3]

[render]
# GATE-03: LibreOffice is not installed on the target machine; Microsoft
# 365 Word 16 is, with the Word.Application COM ProgID registered.
# Adapters: "word_com" | "libreoffice" | "none" | "auto".
converter = "word_com"

# GATE-04 default posture: one isolated invocation per document. Word COM
# is inherently per-document, so combined per-job invocation is not
# applicable to this adapter.
invocation_granularity = "per_document"

converter_timeout_seconds = 180

# DEC-41: both DOCX outputs are the minimum conforming employer-document
# result. A failed or missing PDF is render DEGRADED, never a semantic
# failure, and never a DOCX_ONLY product mode.
pdf_required = false

[render.soft_warnings]
# DEC-24 / DEC-33: editorial signals only. These emit WARNING and never
# fail a command. A document fails mechanically only when unusable,
# corrupted, clipped, or in breach of a verified technical limit.
cv_expected_max_pages = 2
letter_expected_max_pages = 1
competencies_expected_min = 4
competencies_expected_max = 8

[paths]
# runs/ lives inside the build tree. The enclosing OneDrive-named directory
# is an unsynced leftover on this machine (GATE-08 evidence), so there is
# no sync layer between the atomic rename and the filesystem.
runs_root = "runs"
generated_root = "generated"
pilot_log = "pilot/PILOT_LOG.csv"
